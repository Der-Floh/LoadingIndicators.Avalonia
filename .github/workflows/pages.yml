name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_PATH: LoadingIndicators.Avalonia.Demo/LoadingIndicators.Avalonia.Demo.Browser/LoadingIndicators.Avalonia.Demo.Browser.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      - name: Publish .NET Project
        run: dotnet publish "$PROJECT_PATH" -c Release --nologo -o ./publish-output -p:WasmShellWebAppBasePath=./

      - name: Prepare Pages artifacts
        run: |
          touch publish-output/wwwroot/.nojekyll

          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          if [ "$BASE_PATH" != "/" ] && grep -q '<base href="/"' publish-output/wwwroot/index.html; then
            sed -i "s#<base href=\"/\"#<base href=\"${BASE_PATH}/\"#g" publish-output/wwwroot/index.html
          fi

          cp publish-output/wwwroot/index.html publish-output/wwwroot/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish-output/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
